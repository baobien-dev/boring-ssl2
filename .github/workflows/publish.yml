name: publish

on:
  push:
    tags: ["v*"]

jobs:
  # wheels only: the package is nothing without its library, and an sdist would install anywhere and fail at import
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
            name: manylinux-x86_64
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            name: manylinux-aarch64
    runs-on: ${{ matrix.runner }}
    # glibc 2.28 is the oldest the wheel runs on; the image carries CPython 3.14 and the GCC toolset
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          export PATH=/opt/python/cp314-cp314/bin:$PATH
          pip install cmake ninja uv auditwheel
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target boring_ssl2
          cmake --install build --prefix src
          uv build --wheel
          auditwheel repair dist/*.whl -w wheelhouse
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: wheelhouse/

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            tag: macosx_11_0_arm64
            name: macos-arm64
          - runner: macos-15-intel
            tag: macosx_11_0_x86_64
            name: macos-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target boring_ssl2 --parallel
          cmake --install build --prefix src
          uv build --wheel
          uvx --from wheel wheel tags --platform-tag ${{ matrix.tag }} --remove dist/*.whl
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ilammy/setup-nasm@v1.5.2
      - uses: astral-sh/setup-uv@v10.3.3
      - shell: bash
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --target boring_ssl2 --parallel
          cmake --install build --config Release --prefix src
          uv build --wheel
          uvx --from wheel wheel tags --platform-tag win_amd64 --remove dist/*.whl
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-windows-x64
          path: dist/

  # Android and iOS get the shared library as a workflow artifact: Termux builds from source on the device,
  # and an iOS app bundles the library as a framework and passes its path to Library()
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
          cmake --build build --target boring_ssl2 --parallel
          cmake --install build --prefix android
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: library-android-arm64-v8a
          path: android/

  ios:
    strategy:
      matrix:
        sdk: [iphoneos, iphonesimulator]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }} -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build build --target boring_ssl2 --parallel
          cmake --install build --prefix ios-${{ matrix.sdk }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: library-ios-${{ matrix.sdk }}
          path: ios-${{ matrix.sdk }}/

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
